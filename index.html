<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation and Digipin Fetcher</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for aesthetic enhancements */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .container {
            max-width: 90%;
        }
        .card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .loading-spinner {
            border-top-color: #3b82f6;
            -webkit-animation: spin 1s ease-in-out infinite;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="container mx-auto text-center">
        <div id="app-card" class="card bg-white p-6 md:p-10 rounded-xl shadow-2xl transition-all">
            <h1 class="text-3xl font-extrabold text-gray-800 mb-6">Find My Geolocation Details</h1>
            <p class="text-gray-600 mb-8">Click the button below to retrieve your current latitude, longitude, reverse-geocoded address, and Digipin.</p>

            <button id="findLocationBtn" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full 
                           transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50">
                Get My Location Data
            </button>

            <!-- Loading Indicator -->
            <div id="loading" class="mt-8 hidden">
                <div class="inline-block w-8 h-8 border-4 border-gray-200 border-solid rounded-full loading-spinner"></div>
                <p class="text-indigo-600 mt-2 font-medium">Fetching location data...</p>
            </div>

            <!-- Results Container -->
            <div id="results" class="mt-10 text-left space-y-4 border-t pt-6 hidden">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">Location Information</h2>
                
                <div class="flex flex-col sm:flex-row sm:items-center">
                    <p class="w-full sm:w-48 font-bold text-gray-700">Latitude & Longitude:</p>
                    <p id="coords" class="text-indigo-600 font-mono break-all"></p>
                </div>
                
                <div class="flex flex-col sm:flex-row sm:items-center">
                    <p class="w-full sm:w-48 font-bold text-gray-700">Reverse Geocoded Address:</p>
                    <p id="address" class="text-gray-900"></p>
                </div>

                <div class="flex flex-col sm:flex-row sm:items-center">
                    <p class="w-full sm:w-48 font-bold text-gray-700">State/Region:</p>
                    <p id="state" class="text-gray-900"></p>
                </div>

                <div class="flex flex-col sm:flex-row sm:items-center">
                    <p class="w-full sm:w-48 font-bold text-gray-700">Digipin Code:</p>
                    <p id="digipin" class="text-green-600 font-bold text-xl"></p>
                </div>
            </div>

            <!-- Error Message Box -->
            <div id="error-message" class="mt-8 hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-md" role="alert">
                <p class="font-bold">Error:</p>
                <p id="error-details"></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const findLocationBtn = document.getElementById('findLocationBtn');
            const loadingDiv = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');
            const errorMessageDiv = document.getElementById('error-message');
            const errorDetails = document.getElementById('error-details');

            findLocationBtn.addEventListener('click', getLocation);

            // Utility function for exponential backoff retry logic
            const fetchWithRetry = async (url, options = {}, maxRetries = 3, delay = 1000) => {
                for (let i = 0; i < maxRetries; i++) {
                    try {
                        const response = await fetch(url, options);
                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }
                        return response;
                    } catch (error) {
                        if (i === maxRetries - 1) {
                            throw new Error(`Failed to fetch ${url} after ${maxRetries} attempts. Details: ${error.message}`);
                        }
                        await new Promise(resolve => setTimeout(resolve, delay * Math.pow(2, i)));
                    }
                }
            };

            const displayError = (message) => {
                errorMessageDiv.classList.remove('hidden');
                errorDetails.textContent = message;
                loadingDiv.classList.add('hidden');
                resultsDiv.classList.add('hidden');
            };

            const clearUI = () => {
                errorMessageDiv.classList.add('hidden');
                resultsDiv.classList.add('hidden');
                loadingDiv.classList.remove('hidden');
            }

            // --- Geolocation Logic ---
            function getLocation() {
                clearUI();
                
                if (!navigator.geolocation) {
                    displayError('Geolocation is not supported by your browser. Please use a modern browser.');
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    position => {
                        fetchLocationData(position.coords.latitude, position.coords.longitude);
                    },
                    error => {
                        let msg = 'Unknown error occurred.';
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                msg = 'Location access denied. Please grant permission in your browser settings.';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                msg = 'Location information is unavailable.';
                                break;
                            case error.TIMEOUT:
                                msg = 'The request to get user location timed out.';
                                break;
                        }
                        displayError(`Geolocation Error: ${msg}`);
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            }

            // --- API Fetching Logic ---
            async function fetchLocationData(lat, lon) {
                // 1. Display coordinates immediately
                document.getElementById('coords').textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                
                let reverseGeoData = null;
                let digipinCode = 'N/A';

                // --- 2. Fetch Reverse Geocoding Data (Address and State) ---
                const geoApiUrl = `https://api-bdc.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}`;
                
                try {
                    const geoResponse = await fetchWithRetry(geoApiUrl);
                    reverseGeoData = await geoResponse.json();
                    
                    const components = reverseGeoData.localityInfo.administrative;
                    
                    const stateComponent = components.find(c => c.level === 3 || c.name.includes('State') || c.name.includes('Region'));
                    const stateName = stateComponent ? stateComponent.name : 'Not Found';

                    const roadName = reverseGeoData.locality ? reverseGeoData.locality : reverseGeoData.city;
                    const addressDisplay = `${roadName || 'Unknown Location'}, ${reverseGeoData.countryName}`;

                    document.getElementById('address').textContent = addressDisplay;
                    document.getElementById('state').textContent = stateName;

                } catch (error) {
                    console.error("Reverse Geocoding Failed:", error);
                    document.getElementById('address').textContent = 'Error fetching address.';
                    document.getElementById('state').textContent = 'Error fetching state.';
                }
                
                // --- 3. Fetch Digipin Data ---
                // Since the Digipin API endpoint is not specified, we construct a plausible URL using the coordinates.
                // Assuming the Digipin API accepts lat/lon query parameters like the reverse geocode client.
                const digipinApiUrl = `https://apidigipintrax.vercel.app/api/digipin?lat=${lat}&lon=${lon}`;

                try {
                    const digipinResponse = await fetchWithRetry(digipinApiUrl);
                    const digipinJson = await digipinResponse.json();

                    // Assuming the Digipin API returns an object with a 'digipin' or 'code' field.
                    if (digipinJson.digipin || digipinJson.code) {
                        digipinCode = digipinJson.digipin || digipinJson.code;
                    } else if (digipinJson.message) {
                        digipinCode = `Error: ${digipinJson.message}`;
                    } else {
                        // Fallback in case API returns a simple string or different structure
                        digipinCode = JSON.stringify(digipinJson).slice(0, 50) + '...';
                    }

                } catch (error) {
                    console.error("Digipin API Failed:", error);
                    digipinCode = 'Error fetching Digipin (network/format issue).';
                } finally {
                    document.getElementById('digipin').textContent = digipinCode;
                    loadingDiv.classList.add('hidden');
                    resultsDiv.classList.remove('hidden');
                }
            }
        });
    </script>
</body>
</html>
